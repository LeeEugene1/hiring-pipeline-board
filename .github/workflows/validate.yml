name: 검증 및 Vercel 배포

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 제출물, 테스트, 린트, 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Node.js 프로젝트 확인
        id: node-project
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::애플리케이션 초기화 전이므로 테스트, 린트, 빌드를 보류합니다."
            exit 0
          fi

          if [[ ! -f package-lock.json ]]; then
            echo "::error::재현 가능한 의존성 설치를 위해 package-lock.json이 필요합니다."
            exit 1
          fi

          node - <<'NODE'
          const { scripts = {} } = require('./package.json')
          const requiredScripts = ['test:run', 'lint', 'typecheck', 'build']
          const missingScripts = requiredScripts.filter((name) => !scripts[name])

          if (missingScripts.length > 0) {
            console.error(`필수 npm 스크립트가 없습니다: ${missingScripts.join(', ')}`)
            process.exit(1)
          }
          NODE

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 의존성 설치
        if: steps.node-project.outputs.ready == 'true'
        run: npm ci

      - name: 제출물, 테스트, 린트, 타입, 빌드 검증
        run: ./scripts/validate-submission.sh

  deploy-preview:
    name: Vercel Preview 배포
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Vercel Secrets 확인
        shell: bash
        run: |
          missing_secrets=()
          [[ -n "$VERCEL_TOKEN" ]] || missing_secrets+=(VERCEL_TOKEN)
          [[ -n "$VERCEL_ORG_ID" ]] || missing_secrets+=(VERCEL_ORG_ID)
          [[ -n "$VERCEL_PROJECT_ID" ]] || missing_secrets+=(VERCEL_PROJECT_ID)

          if (( ${#missing_secrets[@]} > 0 )); then
            echo "::error::필수 GitHub Actions Secrets가 없습니다: ${missing_secrets[*]}"
            exit 1
          fi

      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Vercel CLI 설치
        run: npm install --global vercel@54.14.0

      - name: Vercel Preview 환경 가져오기
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Preview 빌드
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Preview 배포
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Vercel Production 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Vercel Secrets 확인
        shell: bash
        run: |
          missing_secrets=()
          [[ -n "$VERCEL_TOKEN" ]] || missing_secrets+=(VERCEL_TOKEN)
          [[ -n "$VERCEL_ORG_ID" ]] || missing_secrets+=(VERCEL_ORG_ID)
          [[ -n "$VERCEL_PROJECT_ID" ]] || missing_secrets+=(VERCEL_PROJECT_ID)

          if (( ${#missing_secrets[@]} > 0 )); then
            echo "::error::필수 GitHub Actions Secrets가 없습니다: ${missing_secrets[*]}"
            exit 1
          fi

      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Vercel CLI 설치
        run: npm install --global vercel@54.14.0

      - name: Vercel Production 환경 가져오기
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Production 빌드
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Production 배포
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel Production" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
